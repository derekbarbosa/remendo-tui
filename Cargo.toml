[package]
name = "remendo-tui"
version = "0.1.0"
description = "A terminal interface for Sashiko agentic patch review instances"
authors = ["derekbarbosa <derekasobrab@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/derekbarbosa/remendo-tui"
homepage = "https://derekbarbosa.github.io/remendo-tui/"
readme = "README.md"
keywords = ["linux", "kernel", "code-review", "tui", "sashiko"]
categories = ["command-line-utilities", "development-tools"]
# Exclude tracked files that aren't needed in the published crate.
# Gitignored files (lcov.info, crap-baseline.json, etc.) are excluded automatically.
exclude = [
    ".github/",
    "AGENTS.md",
    "CLAUDE.md",
    "Makefile",
    "scripts/",
    "static/",
    "rust-toolchain.toml",
]

[features]
test-support = []

[dependencies]
async-trait = "0.1"
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
ratatui = "0.30.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"

[dev-dependencies]
insta = { version = "1", default-features = false }
pretty_assertions = "1"
remendo-tui = { path = ".", features = ["test-support"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Lint groups — TRD mandates aggressive clippy profiles
pedantic = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Hard denials — these must never appear in production code
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
# Individual overrides for pedantic lints that are too noisy for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
