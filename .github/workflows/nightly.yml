name: Nightly

# Incremental builds on push/merge to main → hashed nightly release
# Push to next → always packaged and pushed as pre-release
on:
  push:
    branches: [main, next]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build Nightly Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/remendo-tui

      - name: Determine version label
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.ref_name }}" = "main" ]; then
            CHANNEL="nightly"
          else
            CHANNEL="${{ github.ref_name }}"
          fi
          RELEASE_NAME="remendo-tui-${CHANNEL}-${SHORT_SHA}-linux-x86_64"
          TAG_NAME="${CHANNEL}"
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Package archive
        run: |
          RELEASE_NAME="${{ steps.version.outputs.release_name }}"
          mkdir -p "${RELEASE_NAME}"
          cp target/release/remendo-tui "${RELEASE_NAME}/"
          cp README.md config.example.toml "${RELEASE_NAME}/" 2>/dev/null || true
          tar czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}/"

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "remendo-tui ${{ steps.version.outputs.channel }} (${{ steps.version.outputs.short_sha }})"
          body: |
            ## remendo-tui ${{ steps.version.outputs.channel }}

            Built from `${{ github.ref_name }}` at commit ${{ github.sha }}.

            This is an automatically generated pre-release build.
            For stable releases, see the [latest tagged release](../../releases/latest).

            **Commit:** [`${{ steps.version.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Branch:** `${{ github.ref_name }}`
            **Date:** ${{ github.event.head_commit.timestamp }}
          files: "*.tar.gz"
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
