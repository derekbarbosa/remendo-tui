name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: scripts/test.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: scripts/coverage.sh
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  # Save CRAP baseline on main pushes for PR comparisons
  crap-baseline:
    name: CRAP Baseline
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-crap
        run: cargo install cargo-crap --locked
      - name: Generate CRAP baseline
        run: scripts/crap.sh baseline
      - name: Upload CRAP baseline
        uses: actions/upload-artifact@v4
        with:
          name: crap-baseline
          path: crap-baseline.json
          retention-days: 90

  # Post CRAP delta comment on PRs
  crap:
    name: CRAP Analysis
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-crap
        run: cargo install cargo-crap --locked

      # Try to download the baseline from the most recent main run.
      # If none exists (first run, or expired), we skip the baseline
      # and the comment shows absolute scores instead of deltas.
      - name: Download CRAP baseline
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          name: crap-baseline
          workflow: ci.yml
          branch: main
          path: baseline
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Generate CRAP PR comment
        id: crap
        run: |
          # Generate fresh coverage
          scripts/coverage.sh
          # Build the PR comment
          ARGS="--lcov lcov.info --format pr-comment --allow 'tests/**'"
          if [ -f baseline/crap-baseline.json ]; then
            ARGS="$ARGS --baseline baseline/crap-baseline.json"
          fi
          cargo crap $ARGS --output crap-comment.md || true
          {
            echo 'body<<CRAP_EOF'
            cat crap-comment.md
            echo 'CRAP_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.crap.outputs.body }}
          comment-tag: crap-analysis

      # Fail the check if any function regressed vs baseline
      - name: Check for regressions
        if: steps.baseline.outcome == 'success'
        run: |
          ARGS="--lcov lcov.info --format github --allow 'tests/**'"
          ARGS="$ARGS --baseline baseline/crap-baseline.json --fail-regression"
          cargo crap $ARGS

  # Security audit for known vulnerabilities in dependencies
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
