name: Release

# Tagged releases: v* → named version release with binary assets
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Toolchain version is pinned in rust-toolchain.toml.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: scripts/test.sh

  build:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/remendo

      - name: Package archive
        run: |
          RELEASE_NAME="remendo-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "${RELEASE_NAME}"
          cp target/release/remendo "${RELEASE_NAME}/"
          cp README.md config.example.toml "${RELEASE_NAME}/" 2>/dev/null || true
          [ -f LICENSE ] && cp LICENSE "${RELEASE_NAME}/" || true
          tar czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}/"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "ARCHIVE=${RELEASE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: "*.tar.gz"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-binary

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "remendo ${{ github.ref_name }}"
          body: |
            ## remendo ${{ github.ref_name }}

            ### Download

            Download the Linux x86_64 binary from the assets below.

            ### Quick start

            ```sh
            tar xzf remendo-${{ github.ref_name }}-linux-x86_64.tar.gz
            cd remendo-${{ github.ref_name }}-linux-x86_64
            ./remendo
            ```
          files: "*.tar.gz"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
