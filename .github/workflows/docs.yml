name: Docs & Coverage

# Build and deploy rustdoc + llvm-cov HTML to GitHub Pages on push to main
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Documentation & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # Build rustdoc into target/doc/
      - name: Build rustdoc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

      # Build llvm-cov HTML report into target/llvm-cov/html/
      - name: Build coverage report
        run: cargo llvm-cov --all-targets --no-fail-fast --html --output-dir target/llvm-cov

      # Assemble the Pages site:
      #   /            -> index.html (links to both)
      #   /rustdoc/    -> rustdoc output
      #   /coverage/   -> llvm-cov HTML output
      - name: Assemble Pages site
        run: |
          mkdir -p target/pages/rustdoc
          mkdir -p target/pages/coverage
          cp -r static/* target/pages/
          cp -r target/doc/* target/pages/rustdoc/
          cp -r target/llvm-cov/html/* target/pages/coverage/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
